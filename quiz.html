<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>填寫價值觀測驗</title>
  <meta name="description" content="雙人全方位價值觀測驗：75 題填寫頁。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="back" href="index.html">← 回首頁</a>
      <h1>填寫測驗</h1>
      <p class="lead">共 15 個面向、75 題，全部必填。1＝非常不同意，5＝非常同意。作答會自動暫存在這台裝置的瀏覽器中。</p>
    </header>

    <div class="card">
      <label class="field" for="name">你的名稱</label>
      <input type="text" id="name" maxlength="30" placeholder="例如：小明" autocomplete="nickname">
    </div>

    <div class="progress">
      <div class="progress-top"><span id="progress-text">已完成 0 / 75 題</span><span id="progress-pct">0%</span></div>
      <div class="progress-bar"><span id="progress-fill"></span></div>
    </div>

    <form id="quiz" novalidate></form>

    <div class="submit-area">
      <p id="msg" role="status" aria-live="polite"></p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn" id="submit" type="button">完成並下載 JSON 答案檔</button>
        <button class="btn ghost" id="reset" type="button">清除所有作答</button>
      </div>
      <p class="muted">下載後，把檔案和另一位填寫者的檔案一起上傳到 <a href="analysis.html">分析頁</a>。</p>
    </div>

    <div class="card" id="export" hidden>
      <h2>沒有成功下載？</h2>
      <p class="muted">有些手機或 App 內建的瀏覽器會擋下檔案下載。可以改用下面的方式把答案交給對方：</p>
      <div class="btn-row">
        <button class="btn" id="share" type="button" hidden>分享答案檔</button>
        <button class="btn ghost" id="copy" type="button">複製答案</button>
        <button class="btn ghost" id="redownload" type="button">再下載一次</button>
      </div>
      <p id="export-msg" role="status" aria-live="polite"></p>
      <p class="muted">複製後，可以貼到 LINE、備忘錄或訊息傳給對方；在分析頁選擇「貼上答案文字」即可使用。</p>
      <textarea id="export-text" class="code" rows="5" readonly aria-label="答案文字"></textarea>
    </div>

    <footer>資料只存在你的瀏覽器與下載的檔案中</footer>
  </div>
  <script src="js/inapp.js?v=3"></script>
  <script src="js/questions.js?v=3"></script>
  <script src="js/quiz.js?v=3"></script>
</body>
</html>
